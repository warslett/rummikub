services:
  dev:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
      - "5173:5173"

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /app/packages/qa
    volumes:
      - .:/app
    environment:
      - BASE_URL=http://localhost:5173
      - SERVER_URL=http://localhost:3000
    network_mode: host
